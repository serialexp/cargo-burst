[package]
name = "cargo-burst"
version = "0.12.0"
edition = "2024"
authors = ["Bart Riepe <bart@serial-experiments.com>"]
description = "Spin up a Hetzner Cloud server on demand for cargo builds; persistent per-project volume keeps target/ warm between sessions."
license = "MIT OR Apache-2.0"
repository = "https://github.com/serialexp/cargo-burst"
homepage = "https://github.com/serialexp/cargo-burst"
readme = "README.md"
keywords = ["cargo", "build", "remote", "hetzner", "cache"]
categories = ["development-tools::cargo-plugins", "development-tools::build-utils"]

[[bin]]
name = "cargo-burst"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
fs2 = "0.4"
ignore = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "signal", "time", "io-util", "io-std", "net"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
